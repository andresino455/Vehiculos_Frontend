<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <div class="logo-icon">E</div>
      <h1>Emergencias Vehiculares</h1>
      <p>Panel de talleres</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="taller@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button type="submit" [disabled]="cargando" class="btn-primary">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <div class="login-footer">
      ¿No tenés cuenta?
      <a routerLink="/auth/registro">Registrá tu taller</a>
    </div>

  </div>
</div>
